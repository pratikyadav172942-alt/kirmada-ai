<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<title>Kirmada AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1115;--surface:#171A21;--line:#262A34;--text:#E9E7E2;--muted:#8B90A0;--accent:#8FA3FF;--mine:#212849;--err:#F08A8A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 'Instrument Sans',system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font:500 22px 'Fraunces',Georgia,serif;letter-spacing:.2px}
.brand span{color:var(--muted);font-family:'Instrument Sans',sans-serif;font-size:13px;margin-left:6px}
.actions{display:flex;gap:8px}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:500 14px inherit;font-family:inherit;min-height:40px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;max-width:760px;width:100%;margin:0 auto}
.row.me{justify-content:flex-end}
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.me .bubble{background:var(--mine);border-bottom-right-radius:5px}
.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.err{border-color:var(--err);color:var(--err)}
.bubble.err button{display:block;margin-top:8px}
code{background:#0c0e12;padding:1px 5px;border-radius:5px;font-size:.9em}
pre{background:#0c0e12;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:8px 0}
pre code{padding:0;background:none}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.empty{margin:auto;text-align:center;max-width:420px;padding:0 8px}
.empty h1{font:500 30px/1.2 'Fraunces',Georgia,serif;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.box{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px}
.box:focus-within{border-color:var(--accent)}
textarea{flex:1;background:none;border:0;color:var(--text);font:inherit;resize:none;max-height:140px;padding:8px 0;outline:none}
textarea::placeholder{color:var(--muted)}
#send{background:var(--accent);color:#0F1115;border:0;border-radius:13px;font:600 15px inherit;font-family:inherit;padding:0 16px;height:42px;cursor:pointer}
#send:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Kirmada<span>AI</span></div>
  <div class="actions">
    <button class="btn" id="new" type="button">New chat</button>
    <button class="btn" id="clear" type="button">Clear chat</button>
  </div>
</header>
<main id="log" aria-live="polite"></main>
<footer>
  <div class="box">
    <textarea id="input" rows="1" placeholder="Message Kirmada AI" aria-label="Message"></textarea>
    <button id="send" type="button">Send</button>
  </div>
</footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const SUGGESTIONS = ['Explain something simply', 'Help me write a message', 'Plan my day', 'Fix a code problem'];
let msgs = [];
let busy = false;
let error = null;

try { msgs = JSON.parse(sessionStorage.getItem('kirmada') || '[]'); } catch (e) {}
const save = () => { try { sessionStorage.setItem('kirmada', JSON.stringify(msgs)); } catch (e) {} };

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(t) {
  return esc(t)
    .replace(/```\w*\n?([\s\S]*?)```/g, (m, c) => '<pre><code>' + c.replace(/\n$/, '') + '</code></pre>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
}

function row(cls, html) {
  const r = document.createElement('div');
  r.className = 'row ' + cls;
  r.innerHTML = '<div class="bubble">' + html + '</div>';
  return r;
}

function render() {
  log.innerHTML = '';
  if (!msgs.length && !busy && !error) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '<h1>Ask Kirmada anything.</h1><p>Your private AI assistant. Type below or try one of these.</p><div class="chips"></div>';
    SUGGESTIONS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = s;
      b.onclick = () => { input.value = s + ': '; input.focus(); };
      e.querySelector('.chips').appendChild(b);
    });
    log.appendChild(e);
    return;
  }
  msgs.forEach(m => log.appendChild(row(m.role === 'user' ? 'me' : 'ai', fmt(m.text))));
  if (busy) log.appendChild(row('ai', '<span class="dots" aria-label="Kirmada AI is typing"><i></i><i></i><i></i></span>'));
  if (error) {
    const r = row('ai', esc(error) + '<button class="btn" type="button">Try again</button>');
    r.firstChild.classList.add('err');
    r.querySelector('button').onclick = () => request();
    log.appendChild(r);
  }
  log.scrollTop = log.scrollHeight;
}

async function request() {
  busy = true; error = null; sendBtn.disabled = true; render();
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: msgs })
    });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok || !data.reply) throw new Error(data.error || 'Something went wrong. Try again.');
    msgs.push({ role: 'model', text: data.reply });
    save();
  } catch (e) {
    error = e.message && e.message !== 'Failed to fetch' ? e.message : 'No connection. Check your internet and try again.';
  }
  busy = false; sendBtn.disabled = false; render();
}

function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  msgs.push({ role: 'user', text });
  save();
  input.value = ''; grow();
  request();
}

function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', grow);
input.addEventListener('keydown', e => {
  const touch = matchMedia('(pointer:coarse)').matches;
  if (e.key === 'Enter' && !e.shiftKey && !touch) { e.preventDefault(); send(); }
});
sendBtn.onclick = send;

function reset() { msgs = []; error = null; save(); render(); input.focus(); }
document.getElementById('new').onclick = reset;
document.getElementById('clear').onclick = () => {
  if (!msgs.length) return;
  if (confirm('Clear this conversation? This can’t be undone.')) reset();
};

render();
</script>
</body>
</html>
